name: Android demo
on:
  workflow_dispatch:
  push:
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", "gradlew", ".github/workflows/**"]
permissions:
  contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v4
     with:
      packages: "platform-tools platforms;android-35 build-tools;35.0.0"
   - run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
   - uses: actions/upload-artifact@v4
     with:
      name: RideHub-demo-APK
      path: app/build/outputs/apk/debug/*.apk
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: RideHub-test-and-lint-reports
      path: |
       app/build/reports/tests/
       app/build/reports/lint-results-debug.html
      if-no-files-found: ignore
